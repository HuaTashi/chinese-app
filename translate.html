        <h1>Выбери правильный перевод</h1>
        
        <div class="controls">
            <label for="deck-select">Колода:</label>
            <select id="deck-select"></select>
        </div>

        <div class="quiz-container">
            <div class="question" id="question">
                <!-- Здесь будет иероглиф или предложение -->
            </div>
            
            <div class="options" id="options">
                <!-- Здесь будут 4 кнопки с вариантами -->
            </div>

            <div class="pinyin-reveal" id="pinyin-reveal">
    <!-- Здесь появится пиньинь после ответа -->
</div>

<div class="feedback" id="feedback">
    <!-- Здесь будет сообщение о правильности ответа -->
</div>

            <button class="next-btn" id="next-btn" style="display: none;">Следующий вопрос →</button>
        </div>

        <div class="stats">
            <span id="correct-count">Правильно: 0</span>
            <span id="total-count">Всего: 0</span>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="translate.js"></script>
