        <h1>Напиши иероглиф</h1>
        <p class="hint">Введи правильный иероглиф (или слово) по русскому переводу.</p>
        
        <div class="controls">
            <label for="deck-select">Колода:</label>
            <select id="deck-select"></select>
        </div>

        <div class="quiz-container">
            <div class="question" id="question">
                <!-- Здесь будет русский перевод -->
            </div>
            
            <input type="text" id="answer-input" class="answer-input" placeholder="Введи иероглиф здесь..." autocomplete="off">
            
            <button class="check-btn" id="check-btn">Проверить</button>

            <div class="feedback" id="feedback">
                <!-- Здесь будет сообщение о правильности -->
            </div>

            <button class="next-btn" id="next-btn" style="display: none;">Следующее слово →</button>
        </div>

        <div class="stats">
            <span id="correct-count">Правильно: 0</span>
            <span id="total-count">Всего: 0</span>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="write.js"></script>
</body>
</html>
