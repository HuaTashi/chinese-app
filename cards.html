        <h1>Карточки (汉字)</h1>
        
        <div class="controls">
            <label for="deck-select">Выбери колоду:</label>
            <select id="deck-select"></select>
        </div>

        <div class="card-container" id="card-container">
            <div class="card" id="card">
                <div class="card-front" id="card-front">
                    <!-- Сюда попадёт иероглиф -->
                </div>
                <div class="card-back" id="card-back">
                    <!-- Сюда попадёт перевод и пиньинь -->
                </div>
            </div>
        </div>

        <div class="buttons" id="buttons" style="display: none;">
    <button class="btn btn-bad" onclick="rateCard('bad')">😣 Не знаю</button>
    <button class="btn btn-mid" onclick="rateCard('mid')">🤔 Неуверенно</button>
    <button class="btn btn-good" onclick="rateCard('good')">😊 Знаю</button>
        </div>
    </div>
